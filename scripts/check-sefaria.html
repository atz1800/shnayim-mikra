<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בדיקת הפניות לספריא</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px;background:#f7f3ec;color:#2d2722}h1{font-size:1.3rem}table{width:100%;border-collapse:collapse;font-size:.85rem;background:#fff}td,th{padding:.35rem .5rem;border-bottom:1px solid #eee;text-align:start}.ok{color:#2f7a4f}.bad{color:#b3261e;font-weight:700}#sum{font-size:1.1rem;font-weight:700;margin:.8rem 0}button{font:inherit;padding:.5rem 1rem;border-radius:8px;border:1px solid #c9bfae;background:#fff;cursor:pointer}textarea{width:100%;height:120px;margin-top:.5rem;font-family:monospace;font-size:.75rem;direction:ltr}</style></head><body>
<h1>בדיקת הפניות לספריא — שמו״ת</h1><div id="sum">בודק…</div>
<button id="copy" hidden>העתק תוצאות</button><textarea id="out" hidden readonly></textarea>
<table><thead><tr><th>בדיקה</th><th>הפניה</th><th>תוצאה</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const SEFARIA={"בראשית":"Parashat_Bereshit","נח":"Parashat_Noach","לך לך":"Parashat_Lech_Lecha","וירא":"Parashat_Vayera","חיי שרה":"Parashat_Chayei_Sara","תולדות":"Parashat_Toldot","ויצא":"Parashat_Vayetzei","וישלח":"Parashat_Vayishlach","וישב":"Parashat_Vayeshev","מקץ":"Parashat_Miketz","ויגש":"Parashat_Vayigash","ויחי":"Parashat_Vayechi","שמות":"Parashat_Shemot","וארא":"Parashat_Vaera","בא":"Parashat_Bo","בשלח":"Parashat_Beshalach","יתרו":"Parashat_Yitro","משפטים":"Parashat_Mishpatim","תרומה":"Parashat_Terumah","תצוה":"Parashat_Tetzaveh","כי תשא":"Parashat_Ki_Tisa","ויקהל":"Parashat_Vayakhel","פקודי":"Parashat_Pekudei","ויקרא":"Parashat_Vayikra","צו":"Parashat_Tzav","שמיני":"Parashat_Shemini","תזריע":"Parashat_Tazria","מצורע":"Parashat_Metzora","אחרי מות":"Parashat_Achrei_Mot","קדושים":"Parashat_Kedoshim","אמור":"Parashat_Emor","בהר":"Parashat_Behar","בחוקותי":"Parashat_Bechukotai","במדבר":"Parashat_Bamidbar","נשא":"Parashat_Nasso","בהעלותך":"Parashat_Beha'alotcha","שלח":"Parashat_Shelach","קרח":"Parashat_Korach","חוקת":"Parashat_Chukat","בלק":"Parashat_Balak","פינחס":"Parashat_Pinchas","מטות":"Parashat_Matot","מסעי":"Parashat_Masei","דברים":"Parashat_Devarim","ואתחנן":"Parashat_Vaetchanan","עקב":"Parashat_Eikev","ראה":"Parashat_Re'eh","שופטים":"Parashat_Shoftim","כי תצא":"Parashat_Ki_Teitzei","כי תבוא":"Parashat_Ki_Tavo","נצבים":"Parashat_Nitzavim","וילך":"Parashat_Vayeilech","האזינו":"Parashat_Haazinu","וזאת הברכה":"Deuteronomy.33.1-34.12"};
const TRANS={"en":"","ru":"Russian Torah translation, by Dmitri Slivniak, Ph.D., edited by Dr. Itzhak Streshinsky. Da Project, 2011 [ru]","es":"Sefaria Community Translation [es]","fr":"Bible du Rabbinat 1899 [fr]"};
const BOOK={"בראשית":"Genesis","שמות":"Exodus","ויקרא":"Leviticus","במדבר":"Numbers","דברים":"Deuteronomy"};
const rows=document.getElementById("rows"),res=[];
const flat=a=>Array.isArray(a)?a.flat(Infinity):[a];
const cnt=a=>flat(a||[]).filter(x=>typeof x==="string"&&x.trim()).length;
function add(name,ref,ok,info){res.push((ok?"OK ":"BAD ")+name+" | "+ref+" | "+info);const tr=document.createElement("tr");tr.innerHTML="<td></td><td dir=ltr></td><td class="+(ok?"ok":"bad")+"></td>";tr.children[0].textContent=name;tr.children[1].textContent=ref;tr.children[2].textContent=(ok?"✓ ":"✗ ")+info;rows.appendChild(tr)}
async function get(ref,q){const r=await fetch("https://www.sefaria.org/api/texts/"+ref+q);const d=await r.json().catch(()=>({}));return{status:r.status,d}}
(async()=>{
 const samples={};
 for(const[he,ref]of Object.entries(SEFARIA)){
  try{const{status,d}=await get(ref,"?aliyot=1");const n=cnt(d.he&&d.he.length?d.he:d.text);const ok=status===200&&!d.error&&n>0;
   add("פרשת "+he,ref,ok,ok?n+" פסוקים · "+d.ref:(d.error||("HTTP "+status)));if(ok)samples[he]=d.ref}
  catch(e){add("פרשת "+he,ref,false,"שגיאת רשת: "+e.message)}
 }
 for(const[he,id]of[["בראשית","Genesis"],["במדבר","Numbers"],["דברים","Deuteronomy"]]){
  const p=Object.keys(samples).find(k=>samples[k].startsWith(id));if(!p)continue;
  const noBook=samples[p].replace(id+" ","").replace(/:/g,".");
  for(const[label,pre]of[["אונקלוס","Onkelos_"+id+"."],["רש״י","Rashi_on_"+id+"."]]){
   const ref=pre+noBook;try{const{status,d}=await get(ref,"?lang=he");const n=cnt(d.he);add(label+" — "+p,ref,status===200&&n>0,n>0?n+" קטעים":(d.error||("HTTP "+status)))}catch(e){add(label+" — "+p,ref,false,e.message)}
  }
 }
 for(const[lang,ven]of Object.entries(TRANS)){
  const ref="Parashat_Noach";const q="?lang=en&aliyot=0"+(ven?"&ven="+encodeURIComponent(ven):"");
  try{const{status,d}=await get(ref,q);const n=cnt(d.text);const okV=!ven||d.versionTitle===ven;add("תרגום "+lang.toUpperCase(),ven||"(ברירת מחדל)",status===200&&n>0&&okV,n>0?(n+" פסוקים · "+(d.versionTitle||"")):(d.error||("HTTP "+status)))}catch(e){add("תרגום "+lang,ven,false,e.message)}
 }
 const bad=res.filter(r=>r.startsWith("BAD")).length;
 document.getElementById("sum").textContent=bad?("נמצאו "+bad+" בעיות מתוך "+res.length+" בדיקות"):("כל "+res.length+" הבדיקות תקינות ✓");
 const out=document.getElementById("out");out.value=res.join("\n");out.hidden=false;const b=document.getElementById("copy");b.hidden=false;b.onclick=()=>{out.select();navigator.clipboard?.writeText(out.value);b.textContent="הועתק ✓"};
})();
</script></body></html>
