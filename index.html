<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="שמו״ת">
<meta name="theme-color" content="#f7f3ec">
<title>שניים מקרא ואחד תרגום</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Noto+Serif+Hebrew:wght@400;500;700&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f3ec;font-family:'Heebo',-apple-system,sans-serif;}
#html-splash{
  position:fixed;inset:0;z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(168deg,#27344f 0%,#3a2d40 58%,#1a150f 100%);
  padding:0 1.8rem;transition:opacity .5s ease;
}
#html-splash.sp-out{opacity:0;pointer-events:none;}
@keyframes sp-fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes sp-scalein{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes sp-fadeonly{from{opacity:0}to{opacity:1}}
.sp-logo-pre{
  font-family:'Frank Ruhl Libre',serif;font-size:5.6rem;font-weight:900;line-height:1;
  color:#c6a258;
  margin-bottom:.7rem;
}
.sp-subtitle{
  font-family:'Heebo',sans-serif;font-size:.85rem;font-weight:500;
  color:#cfc4ab;letter-spacing:.2em;margin-bottom:2.4rem;
  opacity:0;animation:sp-fadein .6s ease forwards;animation-delay:.75s;
}
.sp-divider{
  width:58px;height:1px;margin-bottom:2.2rem;
  background:linear-gradient(90deg,transparent,#bb9550,transparent);
  border-radius:2px;
  opacity:0;animation:sp-scalein .8s ease forwards;animation-delay:1.15s;
}
.sp-quote-card{
  background:transparent;
  padding:0 .5rem;
  text-align:center;direction:rtl;max-width:340px;width:100%;
  opacity:0;animation:sp-fadein .9s ease forwards;animation-delay:1.6s;
}
.sp-deco{font-size:2.4rem;line-height:.5;color:rgba(198,162,88,.4);font-family:Georgia,serif;display:block;margin-bottom:.6rem;}
.sp-quote{font-family:'Frank Ruhl Libre',serif;font-size:1rem;color:#e7ddc7;line-height:2.25;}
.sp-quote strong{font-weight:700;color:#cda85e;}
.sp-paren{color:#a99873;font-size:.85rem;}
.sp-source{
  margin-top:1.4rem;font-size:.68rem;font-weight:600;
  color:#a98f55;letter-spacing:.2em;font-style:normal;
  opacity:0;animation:sp-fadeonly .6s ease forwards;animation-delay:2.8s;
}
@media (prefers-reduced-motion:reduce){#html-splash,#html-splash *{animation:none!important;transition:none!important;opacity:1!important;transform:none!important;}}
</style>
  <script type="module" src="/src/main.jsx"></script>
</head>
<body>
<div id="html-splash" aria-hidden="true">
  <div class="sp-logo-pre">שמו״ת</div>
  <div class="sp-subtitle">שניים מקרא ואחד תרגום</div>
  <div class="sp-divider"></div>
  <div class="sp-quote-card">
    <span class="sp-deco">❝</span>
    <div class="sp-quote">
      אמר רב הונא בר יהודה אמר רבי אמי<br>
      לעולם ישלים אדם פרשיותיו עם הצבור<br>
      <strong>שנים מקרא ואחד תרגום</strong><br>
      <span class="sp-paren">אפילו עטרות ודיבון</span><br>
      שכל המשלים פרשיותיו עם הצבור<br>
      מאריכין לו ימיו ושנותיו
    </div>
    <div class="sp-source">מסכת ברכות, ח׳ ע״א–ע״ב</div>
  </div>
</div>
<div id="root"></div>
</body>
</html>
